      (function () {
        var BUILD = "1795767270";
        try {
          fetch("./version.json?t=" + Date.now(), { cache: "no-store" })
            .then(function (r) { return r.json(); })
            .then(function (j) {
              if (j && j.v && j.v !== BUILD && sessionStorage.getItem("eqbuild-reload") !== j.v) {
                sessionStorage.setItem("eqbuild-reload", j.v);
                location.replace(location.pathname + "?b=" + j.v);
              }
            })
            .catch(function () {});
        } catch (e) {}
      })();
    </script>
